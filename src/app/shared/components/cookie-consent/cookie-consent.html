@if (showConsent) {
  <div class="cookie-consent-overlay">
    <div class="cookie-consent-dialog">
      <div class="cookie-consent-header">
        <h3>Cookie-Einstellungen</h3>
        <button class="close-btn" (click)="showConsent = false" aria-label="Schließen">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      
      <div class="cookie-consent-content">
        <p>
          Wir verwenden Cookies für die optimale Website-Nutzung, Analyse und personalisierte Inhalte.
        </p>
        
        <div class="cookie-categories">
          <div class="cookie-category">
            <label class="category-label">
              <input type="checkbox" [checked]="consentSettings.necessary" disabled>
              <div class="category-info">
                <strong>Notwendig</strong>
                <small>Essenziell für den Betrieb</small>
              </div>
            </label>
          </div>
          
          <div class="cookie-category">
            <label class="category-label">
              <input type="checkbox" [checked]="consentSettings.analytics" (change)="updateConsent('analytics', $event)">
              <div class="category-info">
                <strong>Analytics</strong>
                <small>Hilft uns die Website zu verbessern</small>
              </div>
            </label>
          </div>
          
          <div class="cookie-category">
            <label class="category-label">
              <input type="checkbox" [checked]="consentSettings.marketing" (change)="updateConsent('marketing', $event)">
              <div class="category-info">
                <strong>Marketing</strong>
                <small>Für personalisierte Werbung</small>
              </div>
            </label>
          </div>
        </div>
      </div>
      
      <div class="cookie-consent-actions">
        <button class="btn btn-secondary" (click)="showConsent = false">Später</button>
        <button class="btn btn-primary" (click)="acceptSelected()">Auswahl</button>
        <button class="btn btn-accept-all" (click)="acceptAll()">Alle akzeptieren</button>
      </div>
    </div>
  </div>
}
