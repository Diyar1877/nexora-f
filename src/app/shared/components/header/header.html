<header class="header" [class.scrolled]="isScrolled()">
    <div class="container header-container">
        <!-- Logo -->
        <a routerLink="/" class="logo">
            <span class="logo-text">NEXORA</span>
            <span class="logo-suffix">SOLUTIONS</span>
        </a>

        <!-- Desktop Navigation -->
        <nav class="nav-desktop d-none d-md-flex">
            <a routerLink="/companies" routerLinkActive="active" class="nav-link">Für Unternehmen</a>
            <a routerLink="/developers" routerLinkActive="active" class="nav-link">Für Entwickler</a>
            <a routerLink="/about" routerLinkActive="active" class="nav-link">Über uns</a>
            <a routerLink="/contact" routerLinkActive="active" class="nav-link">Kontakt</a>
        </nav>

        <!-- CTA & Mobile Menu Toggle -->
        <div class="header-actions">
            <app-button class="d-none d-md-block" routerLink="/contact">Jetzt Anfragen</app-button>

            <button class="mobile-toggle d-md-none" (click)="toggleMenu()" aria-label="Menu">
                <span class="hamburger" [class.active]="isMenuOpen()"></span>
            </button>
        </div>
    </div>

    <!-- Mobile Navigation -->
    <div class="mobile-menu" [class.open]="isMenuOpen()">
        <nav class="nav-mobile">
            <a routerLink="/companies" (click)="closeMenu()" routerLinkActive="active" class="nav-link">Für
                Unternehmen</a>
            <a routerLink="/developers" (click)="closeMenu()" routerLinkActive="active" class="nav-link">Für
                Entwickler</a>
            <a routerLink="/about" (click)="closeMenu()" routerLinkActive="active" class="nav-link">Über uns</a>
            <a routerLink="/contact" (click)="closeMenu()" routerLinkActive="active" class="nav-link">Kontakt</a>
            <div class="mt-md">
                <app-button [fullWidth]="true" routerLink="/contact" (click)="closeMenu()">Jetzt Anfragen</app-button>
            </div>
        </nav>
    </div>
</header>
