<section class="expertise-section">
    <div class="container">
        <div class="expertise-grid">
            <div class="expertise-intro">
                <p class="expertise-label">Was wir können</p>
                <h2 class="expertise-title">Unsere Expertise</h2>
                <p class="expertise-desc">
                    Von der Idee bis zum fertigen Produkt — wir decken das gesamte Spektrum moderner Softwareentwicklung ab.
                </p>
            </div>

            <div class="expertise-list">
                <div class="expertise-item" *ngFor="let item of expertiseItems; let i = index">
                    <div class="item-header" (click)="toggle(i)">
                        <div class="item-left">
                            <span class="item-number">{{ (i + 1).toString().padStart(2, '0') }}</span>
                            <h3 class="item-title">{{ item.title }}</h3>
                        </div>
                        <span class="item-arrow" [class.open]="openIndex === i">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </span>
                    </div>
                    <div class="item-body" [class.open]="openIndex === i">
                        <p>{{ item.description }}</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
