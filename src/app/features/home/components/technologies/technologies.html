<section class="section technologies-section">
    <div class="container-fluid">
        <h2 class="section-title text-center">Leistungen, die wir nutzen & anbieten</h2>

        <div class="marquee-container">
            <div class="marquee-track">
                <!-- Original Set -->
                <div class="marquee-item" *ngFor="let service of services">
                    <div class="service-icon" [innerHTML]="service.icon"></div>
                    <span class="service-name">{{ service.name }}</span>
                </div>

                <!-- Duplicate Set for Seamless Loop -->
                <div class="marquee-item" *ngFor="let service of services">
                    <div class="service-icon" [innerHTML]="service.icon"></div>
                    <span class="service-name">{{ service.name }}</span>
                </div>
            </div>
        </div>
    </div>
</section>
