<section class="mission-section">
    <div class="container">
        <div class="mission-content">
            <p class="mission-label">{{ 'stats.label' | translate }}</p>
            <h2 class="mission-quote">
                {{ 'stats.quote1' | translate }}
                <span class="mission-highlight">{{ 'stats.quote2' | translate }}</span> {{ 'stats.quote3' | translate }}
            </h2>
            <p class="mission-text">
                {{ 'stats.description' | translate }}
            </p>
        </div>

        <div class="mission-divider"></div>

        <div class="mission-stats">
            <div class="mission-stat">
                <span class="stat-value">50+</span>
                <span class="stat-label">{{ 'stats.experts' | translate }}</span>
            </div>
            <div class="mission-stat">
                <span class="stat-value">30+</span>
                <span class="stat-label">{{ 'stats.projects' | translate }}</span>
            </div>
            <div class="mission-stat">
                <span class="stat-value">3+</span>
                <span class="stat-label">{{ 'stats.experience' | translate }}</span>
            </div>
        </div>
    </div>
</section>
