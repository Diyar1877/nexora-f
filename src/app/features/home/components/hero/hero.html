<section class="hero-section">
    <div class="container">
        <div class="hero-content">
            <div class="hero-text">
                <h1 class="hero-title">
                    {{ 'hero.title' | translate }} <br>
                    <span class="text-highlight">{{ 'hero.subtitle' | translate }}</span>
                </h1>
                <p class="hero-subtitle">
                    {{ 'hero.description' | translate }}
                </p>

                <div class="hero-actions">
                    <app-button variant="primary" routerLink="/companies">{{ 'hero.services' | translate }}</app-button>
                    <app-button variant="secondary" routerLink="/contact">{{ 'hero.contactUs' | translate }}</app-button>
                </div>
                <p class="hero-microcopy">{{ 'hero.microcopy' | translate }}</p>
            </div>

            <div class="hero-visual">
                <!-- Abstract Background Shapes -->
                <div class="visual-bg"></div>

                <!-- Illustration Container -->
                <div class="illustration-container">
                    <!-- Laptop Base -->
                    <div class="device laptop">
                        <div class="screen">
                            <div class="code-block">
                                <div class="line w-75"></div>
                                <div class="line w-50"></div>
                                <div class="line w-60"></div>
                                <div class="code-symbol">&lt;/&gt;</div>
                            </div>
                        </div>
                        <div class="keyboard"></div>
                    </div>

                    <!-- Phone Base -->
                    <div class="device phone">
                        <div class="screen">
                            <div class="app-grid">
                                <div class="app-icon"></div>
                                <div class="app-icon"></div>
                                <div class="app-icon"></div>
                                <div class="code-symbol-sm">&lt;/&gt;</div>
                            </div>
                        </div>
                    </div>

                    <!-- Floating Elements -->
                    <div class="floating-icon icon-1"></div>
                    <div class="floating-icon icon-2"></div>
                </div>
            </div>
        </div>
    </div>
</section>
