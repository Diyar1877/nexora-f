<section class="hero-section">
    <div class="container">
        <div class="hero-content">
            <div class="hero-text">
                <h1 class="hero-title">
                    {{ 'home.hero.title1' | translate }} <br>
                    <span class="text-highlight">{{ 'home.hero.title2' | translate }}</span>
                </h1>
                <p class="hero-subtitle">
                    {{ 'home.hero.subtitle' | translate }}
                </p>

                <div class="hero-actions">
                    <app-button variant="primary" routerLink="/services">{{ 'home.hero.ctaPrimary' | translate }}</app-button>
                    <app-button variant="secondary" routerLink="/contact">{{ 'home.hero.ctaSecondary' | translate }}</app-button>
                </div>
            </div>

            <div class="hero-visual">
                <div class="visual-bg"></div>
                <div class="illustration-container">
                    <div class="device laptop">
                        <div class="screen">
                            <div class="code-block">
                                <div class="line w-75"></div>
                                <div class="line w-50"></div>
                                <div class="line w-60"></div>
                                <div class="code-symbol">&lt;/&gt;</div>
                            </div>
                        </div>
                        <div class="keyboard"></div>
                    </div>
                    <div class="device phone">
                        <div class="screen">
                            <div class="app-grid">
                                <div class="app-icon"></div>
                                <div class="app-icon"></div>
                                <div class="app-icon"></div>
                                <div class="code-symbol-sm">&lt;/&gt;</div>
                            </div>
                        </div>
                    </div>
                    <div class="floating-icon icon-1"></div>
                    <div class="floating-icon icon-2"></div>
                </div>
            </div>
        </div>
    </div>
</section>
