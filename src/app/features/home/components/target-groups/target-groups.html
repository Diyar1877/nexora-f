<section class="testimonials-section">
    <div class="container">
        <div class="testimonials-header text-center">
            <p class="testimonials-label">Kundenstimmen</p>
            <h2 class="testimonials-title">Was unsere Partner sagen</h2>
        </div>

        <div class="testimonials-grid">
            <div class="testimonial-card" *ngFor="let testimonial of testimonials">
                <blockquote class="testimonial-quote">
                    &ldquo;{{ testimonial.quote }}&rdquo;
                </blockquote>
                <div class="testimonial-author">
                    <span class="author-name">{{ testimonial.name }}</span>
                    <span class="author-role">{{ testimonial.role }}, {{ testimonial.company }}</span>
                </div>
            </div>
        </div>
    </div>
</section>
